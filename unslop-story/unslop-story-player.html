<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RYMEC Grievance Desk — Unslopping Story Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070c18;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .player-card {
      max-width: 760px;
      width: 100%;
      background: rgba(11, 19, 43, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 30px 70px -15px rgba(0,0,0,0.8);
      backdrop-filter: blur(24px);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 22px;
    }
    .media-viewport {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto 20px;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
      background: #030712;
    }
    .media-viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 18px;
    }
    button {
      padding: 9px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    button.active {
      background: #2563eb;
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.45);
    }
    .footer-note {
      font-size: 11px;
      color: #64748b;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="badge">Unslop Story Animation · 10-Second Redline Transformation</div>
    <h1>RYMEC Grievance Desk</h1>
    <p>Transformation: Spacing Redlines → Color/Icons → Typography → Details &amp; Radii</p>

    <!-- Media Viewport -->
    <div class="media-viewport">
      <img id="mainVisual" src="unslop-story.gif" alt="RYMEC Unslop Transformation" />
    </div>

    <!-- Step Navigator -->
    <div class="controls">
      <button id="btnAuto" class="active" onclick="switchView('gif', this)">▶ Play Full Animation</button>
      <button onclick="switchView('frame_audit.jpg', this)">Beat 0: Slop Audit</button>
      <button onclick="switchView('frame_spacing.jpg', this)">Beat 1: Spacing</button>
      <button onclick="switchView('frame_final.jpg', this)">Beat 4: Final Craft</button>
    </div>

    <div class="footer-note">
      unslop by @heydamir · Rao Bahadur Y. Mahabaleswarappa Engineering College
    </div>
  </div>

  <script>
    function switchView(source, btn) {
      const img = document.getElementById('mainVisual');
      img.src = source + '?t=' + Date.now();
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }
  </script>
</body>
</html>
